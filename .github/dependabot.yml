# Weekly dependency update PRs. Minor and patch bumps come grouped in one PR;
# majors arrive one per PR so each can be tested on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
